services:
  stats-server:
    build: ./stats/stats-server
    ports: [ "9090:9090" ]
    depends_on: { stats-db: { condition: service_healthy } }
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://stats-db:5432/stats"
      SPRING_DATASOURCE_USERNAME: stats
      SPRING_DATASOURCE_PASSWORD: stats
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    healthcheck:
      # Проверяем эндпоинт актуатора внутри контейнера
      test: [ "CMD-SHELL", "wget -qO- http://localhost:9090/actuator/health | grep UP || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s # Даем время JVM и Spring Boot на стартовый прогрев
    networks: [ stats-net ]

  stats-db:
    image: postgres:16.1
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: stats
      POSTGRES_PASSWORD: stats
    volumes: [ stats-db-data:/var/lib/postgresql/data ]
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10
    networks: [ stats-net ]

  ewm-service:
    build: ./main-service
    ports: [ "8080:8080" ]
    depends_on:
      ewm-db: { condition: service_healthy }
      stats-server: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://ewm-db:5432/ewm"
      SPRING_DATASOURCE_USERNAME: ewm
      SPRING_DATASOURCE_PASSWORD: ewm
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      STATS_SERVER_URL: "http://stats-server:9090"
    networks: [ ewm-net, stats-net ]

  ewm-db:
    image: postgres:16.1
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ewm
      POSTGRES_USER: ewm
      POSTGRES_PASSWORD: ewm
    volumes: [ ewm-db-data:/var/lib/postgresql/data ]
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10
    networks: [ ewm-net ]
volumes:
  stats-db-data:
  ewm-db-data:

networks:
  stats-net:
  ewm-net: